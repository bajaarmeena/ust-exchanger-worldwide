<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>USDT Exchanger Worldwide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Beautiful Glass Header --- */
        .header { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px);
            padding: 15px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { 
            font-size: 24px; 
            font-weight: 800;
            background: linear-gradient(90deg, #00f2fe, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        
        .search-bar { 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 30px; 
            padding: 0 20px; 
            width: 40%; 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .search-bar input { background: transparent; border: none; outline: none; padding: 12px; width: 100%; font-size: 14px; color: white; }
        .search-bar input::placeholder { color: rgba(255,255,255,0.5); }
        
        .header-buttons { display: flex; align-items: center; gap: 20px; }
        .login-btn { 
            background: linear-gradient(45deg, #ff0844, #ffb199); 
            color: white; border: none; padding: 10px 25px; 
            font-weight: bold; font-size: 14px; border-radius: 30px; 
            cursor: pointer; box-shadow: 0 4px 15px rgba(255, 8, 68, 0.4);
            transition: 0.3s;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 8, 68, 0.6); }
        
        .wallet-info { display: none; font-size: 14px; font-weight: 600; color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
        .logout-btn { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 6px 15px; border-radius: 30px; margin-left: 15px; cursor: pointer; }
        .logout-btn:hover { background: rgba(255,255,255,0.1); }

        /* --- Main Content Area --- */
        .main-container { display: flex; padding: 40px; gap: 30px; flex-wrap: wrap; justify-content: center; }

        /* --- 3D Cube Section --- */
        .cube-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: 20px; }
        .scene { width: 120px; height: 120px; perspective: 800px; margin-bottom: 20px; }
        .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: rotateCube 10s infinite linear; }
        .cube div { 
            position: absolute; width: 120px; height: 120px; 
            border: 2px solid #00f2fe; 
            background: rgba(0, 242, 254, 0.1); 
            box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.3), 0 0 20px rgba(0, 242, 254, 0.3);
            display: flex; align-items: center; justify-content: center; 
            font-size: 20px; font-weight: bold; color: #00f2fe; 
            text-shadow: 0 0 10px #00f2fe;
            border-radius: 10px;
        }
        .front  { transform: translateZ(60px); border-color: #ff0844; color: #ff0844; box-shadow: inset 0 0 20px rgba(255, 8, 68, 0.3); }
        .back   { transform: translateZ(-60px) rotateY(180deg); border-color: #b224ef; color: #b224ef; box-shadow: inset 0 0 20px rgba(178, 36, 239, 0.3);}
        .right  { transform: rotateY(90deg) translateZ(60px); }
        .left   { transform: rotateY(-90deg) translateZ(60px); }
        .top    { transform: rotateX(90deg) translateZ(60px); border-color: #ffb199; color: #ffb199; }
        .bottom { transform: rotateX(-90deg) translateZ(60px); border-color: #4facfe; color: #4facfe; }
        @keyframes rotateCube { from { transform: rotateX(0) rotateY(0); } to { transform: rotateX(360deg) rotateY(360deg); } }

        /* --- Glass Cards --- */
        .card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; 
            padding: 25px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }

        /* --- Rate Display --- */
        .rate-card { 
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.1), rgba(79, 172, 254, 0.1)); 
            text-align: center; padding: 30px; border-radius: 20px; 
            width: 100%; max-width: 800px; margin-bottom: 20px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.1);
        }
        .rate-title { color: rgba(255,255,255,0.7); font-size: 16px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;}
        .rate-price { color: #00f2fe; font-size: 48px; font-weight: 800; text-shadow: 0 0 20px rgba(0, 242, 254, 0.6); }

        /* --- Forms & Inputs --- */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
        .input-group input, .input-group select { 
            width: 100%; padding: 14px; 
            background: rgba(0, 0, 0, 0.2); 
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 10px; font-size: 15px; color: white; outline: none; 
            transition: 0.3s;
        }
        .input-group input:focus, .input-group select:focus { border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
        .input-group select option { background: #1a1a2e; color: white; }
        
        /* --- Buttons --- */
        .action-btn { 
            width: 100%; 
            background: linear-gradient(45deg, #00f2fe, #4facfe); 
            color: #000; border: none; padding: 16px; 
            font-size: 16px; font-weight: 800; border-radius: 10px; cursor: pointer; 
            box-shadow: 0 5px 20px rgba(0, 242, 254, 0.4);
            transition: 0.3s;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 242, 254, 0.6); }

        .deposit-btn { background: linear-gradient(45deg, #11998e, #38ef7d); color: #000; box-shadow: 0 5px 15px rgba(56, 239, 125, 0.3); }
        .withdraw-btn { background: linear-gradient(45deg, #ff0844, #ffb199); color: #fff; box-shadow: 0 5px 15px rgba(255, 8, 68, 0.3); }

        /* --- Recent Trades --- */
        .trade-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .trade-item:last-child { border-bottom: none; }
        .text-green { color: #38ef7d; font-weight: bold; text-shadow: 0 0 10px rgba(56, 239, 125, 0.4); }
        .text-red { color: #ff0844; font-weight: bold; text-shadow: 0 0 10px rgba(255, 8, 68, 0.4); }

        /* --- Modals (Popups) --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { 
            background: #1a1a2e; padding: 40px; border-radius: 20px; width: 400px; 
            position: relative; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .modal-close { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: rgba(255,255,255,0.5); transition: 0.3s; }
        .modal-close:hover { color: #ff0844; transform: rotate(90deg); }
        .modal-title { font-size: 22px; margin-bottom: 25px; color: #00f2fe; text-align: center; }
        .modal-input { 
            width: 100%; padding: 14px; margin-bottom: 20px; 
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 10px; color: white; outline: none; font-size: 15px;
        }
        .modal-input:focus { border-color: #00f2fe; }
        .modal-btn { 
            width: 100%; background: linear-gradient(45deg, #00f2fe, #4facfe); 
            color: #000; border: none; padding: 14px; font-size: 16px; 
            font-weight: bold; border-radius: 10px; cursor: pointer; 
        }
        #qrImage { width: 220px; height: 220px; margin: 20px auto; display: block; border-radius: 10px; border: 2px solid #00f2fe; }
        .qr-amount { text-align: center; font-size: 24px; font-weight: bold; color: #fff; margin-bottom: 10px; }

        /* --- History Table --- */
        .history-section { 
            width: 100%; max-width: 800px; 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 25px; margin-bottom: 40px; 
            display: none; 
        }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: rgba(0,0,0,0.2); color: #00f2fe; text-align: left; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 500; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; color: #e0e0e0; }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>USDT EXCHANGER</h1>
        <div class="search-bar">
            <input type="text" placeholder="Search for USDT, INR, Wallet...">
        </div>
        <div class="header-buttons">
            <button id="loginBtn" class="login-btn" onclick="openModal()">Login / Register</button>
            <div id="walletDisplay" class="wallet-info">
                <span id="userName"></span> | ₹<span id="inrBal">0</span> | <span id="usdtBal">0</span> USDT
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <!-- 3D Cube and Rate -->
        <div class="cube-wrapper">
            <div class="scene">
                <div class="cube">
                    <div class="front">USDT</div>
                    <div class="back">INR</div>
                    <div class="right">LIVE</div>
                    <div class="left">RATE</div>
                    <div class="top">SECURE</div>
                    <div class="bottom">FAST</div>
                </div>
            </div>
            <div class="rate-card">
                <div class="rate-title">Live USDT / INR Rate</div>
                <div class="rate-price" id="liveRate">Loading...</div>
            </div>
        </div>

        <!-- Trade Panel -->
        <div class="card">
            <div class="card-title">Trade USDT</div>
            <div class="input-group">
                <label>I want to</label>
                <select id="tradeType">
                    <option value="Buy">Buy USDT (Pay via UPI)</option>
                    <option value="Sell">Sell USDT (Get INR)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Enter Amount (in USDT)</label>
                <input type="number" id="amount" placeholder="e.g. 10">
            </div>
            <button class="action-btn" onclick="submitTrade()">Proceed to Pay</button>
            
            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button class="action-btn deposit-btn" onclick="openDepositModal()" style="flex: 1;">Deposit INR</button>
                <button class="action-btn withdraw-btn" onclick="openWithdrawModal()" style="flex: 1;">Withdraw INR</button>
            </div>
        </div>

        <!-- Recent Transactions -->
        <div class="card">
            <div class="card-title">Recent Transactions</div>
            <div id="orderBookList">
                <p style="color: rgba(255,255,255,0.5); font-size: 14px;">Loading...</p>
            </div>
        </div>

        <!-- History Section -->
        <div id="historySection" class="history-section">
            <div class="card-title">Your Transaction History</div>
            <table>
                <thead>
                    <tr><th>Date</th><th>Type</th><th>Amount</th><th>Rate</th><th>Total (₹)</th></tr>
                </thead>
                <tbody id="historyTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Modals -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">×</span>
            <div class="modal-title" id="modalTitle">Login</div>
            <input type="text" id="username" class="modal-input" placeholder="Username">
            <input type="password" id="password" class="modal-input" placeholder="Password">
            <button id="authSubmitBtn" class="modal-btn" onclick="submitAuth()">Login</button>
            <p style="text-align: center; margin-top: 20px; font-size: 14px; color: #00f2fe; cursor: pointer;" onclick="toggleAuthMode()"><span id="toggleText">New? Create an account</span></p>
        </div>
    </div>

    <div id="qrModal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <span class="modal-close" onclick="closeQRModal()">×</span>
            <div class="modal-title">Scan & Pay</div>
            <p style="font-size: 14px; color: rgba(255,255,255,0.6);">Total Payable Amount</p>
            <div class="qr-amount">₹<span id="displayInrAmount">0</span></div>
            <img id="qrImage" src="" alt="QR Code">
            <button class="modal-btn" onclick="confirmPayment()" style="background: #38ef7d;">I have Paid</button>
        </div>
    </div>

    <div id="depositModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModalById('depositModal')">×</span>
            <div class="modal-title">Deposit INR</div>
            <input type="number" id="depositAmount" class="modal-input" placeholder="Amount (₹)">
            <button class="modal-btn" onclick="processDeposit()" style="background: #38ef7d;">Deposit Now</button>
        </div>
    </div>

    <div id="withdrawModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModalById('withdrawModal')">×</span>
            <div class="modal-title">Withdraw INR</div>
            <input type="number" id="withdrawAmount" class="modal-input" placeholder="Amount (₹)">
            <button class="modal-btn" onclick="processWithdraw()" style="background: #ff0844;">Request Withdraw</button>
        </div>
    </div>

    <script>
        let isLoginMode = true;
        let currentUser = null;
        let pendingTrade = null;

        function openModal() { document.getElementById('authModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('authModal').style.display = 'none'; }
        function closeQRModal() { document.getElementById('qrModal').style.display = 'none'; }
        function closeModalById(id) { document.getElementById(id).style.display = 'none'; }
        
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('modalTitle').innerText = isLoginMode ? "Login" : "Register";
            document.getElementById('authSubmitBtn').innerText = isLoginMode ? "Login" : "Register";
            document.getElementById('toggleText').innerText = isLoginMode ? "New? Create an account" : "Already have an account? Login";
        }

        async function submitAuth() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const endpoint = isLoginMode ? '/api/login' : '/api/register';

            const res = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
            const data = await res.json();

            if (data.success) {
                if (isLoginMode) {
                    currentUser = data.user;
                    updateUI();
                    closeModal();
                    loadHistory();
                } else {
                    alert("Registration Successful! Please login.");
                    toggleAuthMode();
                }
            } else { alert(data.message); }
        }

        function updateUI() {
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('walletDisplay').style.display = 'block';
            document.getElementById('historySection').style.display = 'block';
            document.getElementById('userName').innerText = currentUser.username;
            document.getElementById('inrBal').innerText = currentUser.inrBalance.toFixed(2);
            document.getElementById('usdtBal').innerText = currentUser.usdtBalance.toFixed(2);
        }

        function logout() {
            currentUser = null;
            document.getElementById('loginBtn').style.display = 'block';
            document.getElementById('walletDisplay').style.display = 'none';
            document.getElementById('historySection').style.display = 'none';
        }

        async function fetchRate() {
            try {
                const res = await fetch('/api/rate');
                const data = await res.json();
                document.getElementById('liveRate').innerText = '₹ ' + data.rate.toFixed(2);
            } catch (e) { document.getElementById('liveRate').innerText = 'Error'; }
        }
        setInterval(fetchRate, 10000); fetchRate();

        async function submitTrade() {
            if (!currentUser) return alert("Please login first!");
            const type = document.getElementById('tradeType').value;
            const amount = document.getElementById('amount').value;
            if(!amount) return alert('Enter amount');

            if (type === 'Buy') {
                const settingsRes = await fetch('/api/settings');
                const settingsData = await settingsRes.json();
                const adminUpi = settingsData.settings.upiId;
                const customQr = settingsData.settings.qrImage;

                if (customQr && customQr !== '') {
                    document.getElementById('qrImage').src = customQr;
                    document.getElementById('displayInrAmount').innerText = "Custom QR";
                    document.getElementById('qrModal').style.display = 'flex';
                    pendingTrade = { type, amount, username: currentUser.username };
                } else {
                    const res = await fetch('/api/generate-qr', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount: amount, upiId: adminUpi }) });
                    const data = await res.json();
                    if (data.success) {
                        pendingTrade = { type, amount, username: currentUser.username };
                        document.getElementById('qrImage').src = data.qrCode;
                        document.getElementById('displayInrAmount').innerText = data.calculatedINR;
                        document.getElementById('qrModal').style.display = 'flex';
                    }
                }
            } else {
                executeTrade(type, amount);
            }
        }

        function confirmPayment() {
            if(pendingTrade) { executeTrade(pendingTrade.type, pendingTrade.amount); closeQRModal(); pendingTrade = null; }
        }

        async function executeTrade(type, amount) {
            const res = await fetch('/api/trade', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type, amount, username: currentUser.username }) });
            const result = await res.json();
            if (result.success) {
                alert(result.message);
                currentUser.inrBalance = result.newINR;
                currentUser.usdtBalance = result.newUSDT;
                updateUI();
                loadHistory();
                fetchRecentTrades();
            } else { alert(result.message); }
        }

        async function fetchRecentTrades() {
            const res = await fetch('/api/recent-trades');
            const data = await res.json();
            const list = document.getElementById('orderBookList');
            list.innerHTML = '';
            if (data.success && data.trades.length > 0) {
                data.trades.forEach(trade => {
                    const colorClass = trade.type === 'Buy' ? 'text-green' : 'text-red';
                    list.innerHTML += `<div class="trade-item"><span>${trade.username.substring(0,3)}***</span><span class="${colorClass}">${trade.type}</span><span>${trade.amount} USDT</span><span>₹${trade.rate.toFixed(2)}</span></div>`;
                });
            } else { list.innerHTML = '<p style="color: rgba(255,255,255,0.5); font-size: 14px;">No recent transactions.</p>'; }
        }
        setInterval(fetchRecentTrades, 5000); fetchRecentTrades();

        function openDepositModal() {
            if (!currentUser) return alert("Please login first!");
            document.getElementById('depositModal').style.display = 'flex';
        }
        function openWithdrawModal() {
            if (!currentUser) return alert("Please login first!");
            document.getElementById('withdrawModal').style.display = 'flex';
        }

        async function processDeposit() {
            const amount = document.getElementById('depositAmount').value;
            if(!amount || amount <= 0) return alert("Enter valid amount");
            const res = await fetch('/api/deposit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: currentUser.username, amount }) });
            const data = await res.json();
            alert(data.message);
            if(data.success) {
                currentUser.inrBalance = data.newINR;
                updateUI();
                closeModalById('depositModal');
                loadHistory();
            }
        }

        async function processWithdraw() {
            const amount = document.getElementById('withdrawAmount').value;
            if(!amount || amount <= 0) return alert("Enter valid amount");
            const res = await fetch('/api/withdraw', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: currentUser.username, amount }) });
            const data = await res.json();
            alert(data.message);
            if(data.success) {
                currentUser.inrBalance = data.newINR;
                updateUI();
                closeModalById('withdrawModal');
                loadHistory();
            }
        }

        async function loadHistory() {
            if (!currentUser) return;
            const res = await fetch(`/api/history/${currentUser.username}`);
            const data = await res.json();
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';
            
            if (data.success && data.trades.length > 0) {
                data.trades.forEach(trade => {
                    let color = (trade.type === 'Buy' || trade.type === 'Withdraw') ? '#ff0844' : '#38ef7d';
                    let displayAmount = (trade.type === 'Deposit' || trade.type === 'Withdraw') ? `₹${trade.amount}` : `${trade.amount} USDT`;
                    let displayRate = (trade.type === 'Deposit' || trade.type === 'Withdraw') ? '-' : `₹${trade.rate.toFixed(2)}`;
                    
                    tbody.innerHTML += `<tr>
                        <td>${new Date(trade.date).toLocaleString()}</td>
                        <td style="font-weight: bold; color: ${color};">${trade.type}</td>
                        <td>${displayAmount}</td>
                        <td>${displayRate}</td>
                        <td>₹${trade.totalINR.toFixed(2)}</td>
                    </tr>`;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px; color: rgba(255,255,255,0.5);">No transactions yet.</td></tr>';
            }
        }
    </script>
</body>
</html>
